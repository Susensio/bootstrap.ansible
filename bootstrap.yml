- hosts: all
  gather_facts: true
  vars_files: vars.yml

  pre_tasks:
    - name: Temp directories exist
      # become: true
      file:
        path: "/tmp/ansible"
        state: directory
        mode: 0777
      tags:
      - always

  roles:
    - xdg
    - packages
    - yadm
    - ssh
    - anacron
    # - gh
    # - docker
    # - bin
    - eget
    - fish
    - tmux
    - nvim

- hosts: desktops
  roles:
    - keyd
    - cidm
    - fonts
