- name: Packages are installed
  become: true
  apt:
    name: "{{ apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 60*60*24*7 }}"  # 1 week
    autoclean: true
    autoremove: true
    purge: true
  tags:
    - install
    - packages

- name: bat symlink exists
  become: true
  file:
    src: /usr/bin/batcat
    dest: /usr/bin/bat
    state: link
  tags:
    - install
    - packages

- name: fd symlink exists
  become: true
  file:
    src: /usr/bin/fdfind
    dest: /usr/bin/fd
    state: link
  tags:
    - install
    - packages
